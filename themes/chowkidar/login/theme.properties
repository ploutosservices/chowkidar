# Chowkidar's login theme: a child of Keycloak's own v2 login theme; everything is Keycloak's except the brand.
# styles re-lists the parent's stylesheet, because a child's `styles` replaces the parent's list.
# scripts: the deployment's settings first (js/chowkidar-config.js), then the bar that draws the title bar from them.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/chowkidar-v4.css css/chowkidar-bar-v1.css css/chowkidar-hide-v1.css css/chowkidar-hide-v2.css
scripts=js/chowkidar-config.js js/chowkidar-bar-v6.js
